  <h2 id="Accession_register">Accession register</h2>
  <p>
    An <b>accession register</b> lists the objects a collection receives. A
    single entry can cover a set of related objects.
  </p>
  <p>Common fields include the following.</p>
  <ul>
    <li>Accession number</li>
    <li>Source of acquisition</li>
    <li>Temporary location</li>
  </ul>
  <p>
    See the
    <a href="https://example.com/paper-corpus/collection-glossary"
      >collection glossary</a
    >
    for related terms.
  </p>
</div>
