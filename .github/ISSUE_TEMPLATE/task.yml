name: Task
description: One unit of work. Becomes one branch, one worktree and one PR. Plain words; `scripts/ocv-task.mjs file` fills this form for you.
title: "type: "
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Use the same word as the title prefix and the branch (`type/<issue#>-short-description`).
      options:
        - feat
        - fix
        - hotfix
        - refactor
        - chore
        - docs
    validations:
      required: true
  - type: textarea
    id: your-words
    attributes:
      label: Your words
      description: What the owner asked for, in the owner's own words. Quote them. Never write your own choices here.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What changes and why it matters, in short plain sentences.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Up to 6 lines. Each line names something the owner can see or try.
      placeholder: |
        - ...
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: Only high risk needs the owner to comment /approve before work starts.
      options:
        - low
        - normal
        - high
      default: 1
    validations:
      required: true
  - type: textarea
    id: could-go-wrong
    attributes:
      label: What could go wrong
      description: Required when risk is high.
    validations:
      required: false
  - type: textarea
    id: questions
    attributes:
      label: Questions for you
      description: Choices that are the owner's to make. Ask here instead of deciding.
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Details for the agent
      description: Technical notes, file names, commands and code. This section is not checked for plain words.
    validations:
      required: false
