name: Task
description: One unit of work. Becomes one branch, one worktree and one PR.
title: "type: "
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Use the same word as the title prefix and the branch (`type/<issue#>-short-description`).
      options:
        - feat
        - fix
        - hotfix
        - refactor
        - chore
        - docs
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is true when this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: The checks that decide it is done.
      placeholder: |
        - ...
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: The command, test or screenshot that shows each acceptance item.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
    validations:
      required: false
