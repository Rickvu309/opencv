name: Bug
description: Something is broken. Branch type `fix`, or `hotfix` if production is broken now.
title: "fix: "
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: |
        Production broken right now? Change the label to `hotfix` and follow the hotfix flow
        (docs/git-workflow/deploys-and-hotfixes.md).
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Actual behavior. Include error messages and screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Production
        - Local
    validations:
      required: true
