name: Feature
description: New functionality or a user-visible change. Branch type `feat`.
title: "feat: "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: |
        One issue = one branch = one PR. If this takes more than a few days, split it into sub-issues.
        Assign yourself before you start.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible after this is done, and for whom?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it is done? One per line.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, designs, constraints, out of scope.
    validations:
      required: false
