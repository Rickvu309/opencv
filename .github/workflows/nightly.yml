name: Full run on main

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  full:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: nightly-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm check:full lint typecheck test build

  failure:
    needs: full
    if: ${{ always() && needs.full.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'Full run failed on main';
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `The full check failed on main at ${context.sha}.\n\n[Run logs](${url}) (attempt ${process.env.GITHUB_RUN_ATTEMPT}).\n\nInvestigate before closing this issue. Successful runs do not close it automatically.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'ci-full', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              try {
                await github.rest.issues.createLabel({ owner, repo, name: 'ci-full', color: 'b60205' });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
              await github.rest.issues.create({ owner, repo, title, body, labels: ['ci-full'] });
            }

  rerun-main-once:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - run: gh run rerun "$RUN_ID" --failed
