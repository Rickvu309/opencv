name: Checks

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A fresh hosted VM has no git identity, and the test suites make throwaway commits in temp repos.
      # This identity lives only on this VM; nothing it commits leaves the job.
      - run: |
          git config --global user.name ci
          git config --global user.email ci@users.noreply.github.com
      # A pull_request checkout has no local main; the take tests clone it.
      - run: git branch -f main origin/main
      - run: pnpm check
        env:
          VITEST_MAX_WORKERS: 2

  # The one required check. The main ruleset requires the context "ci", so keep this name.
  ci:
    needs: [check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success
