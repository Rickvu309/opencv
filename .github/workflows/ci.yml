name: Checks

on:
  pull_request:

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The quick check on what the PR changed, on this machine's runner (free, no Actions minutes).
  # The runner runs one job at a time. The full check stays in scripts/review-pr.sh.
  check:
    runs-on: [self-hosted, opencv-local]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A pull_request checkout has no local main; test-new-task.sh clones it.
      - run: git branch -f main origin/main
      # The runner service does not load the login PATH; pnpm lives in ~/.local/bin.
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # @workspace/domain points its types at ./dist, which a clean checkout does not have.
      - run: pnpm --filter @workspace/domain build
      - run: scripts/check.sh --changed

  # The one required check. The main ruleset requires the context "ci", so keep this name.
  ci:
    needs: [check]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, opencv-local]
    steps:
      - run: test "${{ needs.check.result }}" = success
