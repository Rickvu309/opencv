name: Checks

on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_SCM_BASE: origin/main
  TURBO_SCOPE: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  VITEST_MAX_WORKERS: 2

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run test --filter=@workspace/guards
      - run: pnpm exec turbo run test:open-pr --filter=@workspace/guards
      - run: pnpm exec turbo run test:assumptions --filter=web

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run lint $TURBO_SCOPE
      - name: Prettier
        run: |
          set -o pipefail
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            pnpm exec prettier --check --ignore-unknown -- .
            exit 0
          fi
          base=$(git merge-base origin/main HEAD)
          full=0
          while IFS= read -r -d '' file; do
            case "$file" in
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|.npmrc|.nvmrc|.node-version|.pnpmfile.cjs|vitest.*|scripts/check.mjs|.railway/railway.ts|.gitattributes) full=1 ;;
              */*) ;;
              *.config.*|tsconfig*.json|.eslint*|.prettier*) full=1 ;;
            esac
          done < <(git diff --name-only -z "$base" HEAD)
          if (( full )); then
            pnpm exec prettier --check --ignore-unknown -- .
          else
            git diff --name-only --no-renames --diff-filter=ACMR -z "$base" HEAD | xargs -0 -r pnpm exec prettier --check --ignore-unknown --
          fi

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run typecheck $TURBO_SCOPE

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run build $TURBO_SCOPE

  test-api:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run test $TURBO_SCOPE --filter=api -- --shard=${{ matrix.shard }}/2
      - if: matrix.shard == 1
        run: pnpm exec turbo run test $TURBO_SCOPE --filter=@workspace/domain

  formal-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORMAL_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run test:formal $TURBO_SCOPE --filter=api

  test-web:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run test $TURBO_SCOPE --filter='!api' --filter='!@workspace/domain' --filter='!@workspace/guards' -- --shard=${{ matrix.shard }}/3

  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch the screens
        id: gate
        run: |
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base origin/main HEAD)
          if git diff --name-only "$base" HEAD | grep -qE '^(apps/web/|packages/ui/|packages/domain/|\.claude/skills/verify-(app-ui|opencv)/|scripts/ci-screens|scripts/lib/ci-screens|\.github/workflows/ci\.yml|\.github/actions/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No file the screens depend on changed, so the screen checks are not needed."
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup
      - name: Screen layout checks
        if: steps.gate.outputs.run == 'true'
        env:
          CI_SCREENS_OUT: ${{ runner.temp }}/ci-screens
        run: |
          CHROME_BIN=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          export CHROME_BIN
          "$CHROME_BIN" --version
          node scripts/ci-screens.mjs
      - name: Upload screenshots and logs
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}/ci-screens
          retention-days: 7
          if-no-files-found: ignore

  formal-tla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch a formal model
        id: gate
        run: |
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base origin/main HEAD)
          FORMAL_BASE="$base" node scripts/lib/ci-workflow.mjs gate
      - if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup
      - id: java
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache tla2tools 1.7.4
        id: tla-jar
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: tla-tools/tla2tools.jar
          key: tla2tools-1.7.4-${{ env.TLA_SHA256 }}
      - name: Pin tla2tools 1.7.4
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p tla-tools
          if [[ ! -f tla-tools/tla2tools.jar ]]; then
            curl -fsSL -o tla-tools/tla2tools.jar \
              https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          fi
          echo "$TLA_SHA256  tla-tools/tla2tools.jar" | sha256sum -c -
      - name: Run the formal models
        if: steps.gate.outputs.run == 'true'
        env:
          JAVA_HOME: ${{ steps.java.outputs.path }}
          TLA2TOOLS: ${{ github.workspace }}/tla-tools/tla2tools.jar
        run: node scripts/tlc.mjs --all

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Server-held pull request rules
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          choice=$(node scripts/lib/ci-workflow.mjs policy)
          case "$choice" in
            run:*)
              node scripts/ocv-tools.mjs policy "${choice#run:}"
              ;;
            fail)
              echo "::error title=POLICY::no pull request number in the ${GITHUB_EVENT_NAME} event"
              exit 1
              ;;
            skip)
              echo "::notice title=POLICY::no pull request applies to the ${GITHUB_EVENT_NAME} event"
              ;;
            *)
              echo "::error title=POLICY::unexpected policy choice"
              exit 1
              ;;
          esac

  ci:
    needs:
      [
        guards,
        lint,
        typecheck,
        build,
        test-api,
        formal-postgres,
        test-web,
        screens,
        formal-tla,
        policy,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: "${{ contains(needs.*.result, 'failure') }}"
      - name: Print the first error of each failed job
        if: "${{ contains(needs.*.result, 'failure') }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-first-errors.mjs
      - name: Require every job to succeed
        if: ${{ always() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e 'const needs = JSON.parse(process.env.NEEDS); const failures = Object.entries(needs).filter(([, job]) => job.result !== "success"); if (failures.length) { console.error(failures.map(([name, job]) => `${name}: ${job.result}`).join("\n")); process.exit(1); }'
