name: Setup workspace
description: Set up pnpm, Node, dependencies, and the CI test git environment.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: |
        git config --global user.name ci
        git config --global user.email ci@users.noreply.github.com
      shell: bash
    - run: |
        git show-ref --verify --quiet refs/remotes/origin/main || git fetch origin main:refs/remotes/origin/main
        if [[ "$(git branch --show-current)" != "main" ]]; then
          git branch -f main origin/main
        fi
      shell: bash
    - run: |
        if [[ -n "$(git diff --name-only origin/main...HEAD -- .github/workflows/ci.yml .github/actions/setup)" ]]; then
          echo "TURBO_SCOPE=" >> "$GITHUB_ENV"
        fi
      shell: bash
