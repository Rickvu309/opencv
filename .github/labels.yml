# Source of truth for repo labels. Apply with the commands in CONTRIBUTING.md ("Setup").
# Format is compatible with common label-sync actions (name / color / description).
- name: feat
  color: "0e8a16"
  description: New feature (branch feat/)
- name: fix
  color: "d73a4a"
  description: Bug fix (branch fix/)
- name: hotfix
  color: "b60205"
  description: Urgent production fix (branch hotfix/)
- name: refactor
  color: "1d76db"
  description: Code change with no behavior change (branch refactor/)
- name: chore
  color: "c5def5"
  description: Deps, config, tooling (branch chore/)
- name: docs
  color: "0075ca"
  description: Documentation only (branch docs/)
- name: needs-human-review
  color: "fbca04"
  description: A big decision. Blocks merge until a human approves
- name: needs-triage
  color: "ededed"
  description: Maintainer needs to evaluate this issue
- name: needs-info
  color: "d876e3"
  description: Waiting on reporter for more information
- name: ready-for-agent
  color: "0e8a16"
  description: Fully specified, ready for an AFK agent
- name: ready-for-human
  color: "5319e7"
  description: A decision for a human, never picked up by implementation agents
- name: wontfix
  color: "ffffff"
  description: Will not be actioned
