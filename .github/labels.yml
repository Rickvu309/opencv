# Source of truth for repo labels: only labels something reads. `node scripts/pr.mjs doctor` diffs GitHub against this file
# and prints the gh command that fixes each drift.
- name: feat
  color: "0e8a16"
  description: New feature (branch feat/)
- name: fix
  color: "d73a4a"
  description: Bug fix (branch fix/)
- name: hotfix
  color: "b60205"
  description: Urgent production fix (branch hotfix/)
- name: refactor
  color: "1d76db"
  description: Code change with no behavior change (branch refactor/)
- name: chore
  color: "c5def5"
  description: Deps, config, tooling (branch chore/)
- name: docs
  color: "0075ca"
  description: Documentation only (branch docs/)
- name: needs-human-review
  color: "fbca04"
  description: A big decision. Blocks merge until a human approves
- name: ready-for-human
  color: "5319e7"
  description: A decision for a human, never picked up by implementation agents
- name: "risk:low"
  color: "c2e0c6"
  description: Low risk. No owner approval needed (ocv-task reads it)
- name: "risk:normal"
  color: "bfd4f2"
  description: Normal risk. No owner approval needed (ocv-task reads it)
- name: "risk:high"
  color: "e11d21"
  description: High risk. Needs an owner /approve comment after the last issue edit
